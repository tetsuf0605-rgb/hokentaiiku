<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="保健体育">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>保健体育 問題集</title>
<style>
  :root{
    --bg:#f2f2f7;           /* iOS グループ背景 */
    --bg2:#e9e9ef;
    --card:#ffffff;
    --ink:#1c1c1e;
    --ink2:#6c6c70;
    --line:#d8d8de;
    --ok:#248a3d;
    --ng:#d70015;
    --blue:#007AFF;
    /* グループごとのアクセント（JSで切り替え） */
    --acc:#E8590C;
    --acc-d:#B8460A;
    --acc-soft:#fdeee4;
  }
  body.g-hoken{--acc:#0A8F8F;--acc-d:#076E6E;--acc-soft:#e1f3f3;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));}

  /* グループ切り替え（セグメント） */
  .seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin:6px 0 4px;}
  .seg button{flex:1;border:none;background:transparent;font-size:16px;font-weight:600;color:var(--ink2);
    padding:9px 0;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;}
  .seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.15);}

  /* ヘッダー（Large Title） */
  header{padding:12px 4px 2px;}
  header .eyebrow{font-size:13px;font-weight:600;color:var(--acc);margin:0;}
  header h1{font-size:30px;font-weight:800;margin:0;letter-spacing:.01em;line-height:1.3;}
  header .sub{font-size:13px;color:var(--ink2);margin:2px 0 0;}

  .card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0;}

  .stat-row{display:flex;gap:10px;margin:0 0 6px;}
  .stat{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:10px 4px;}
  .stat b{display:block;font-size:22px;color:var(--ink);}
  .stat span{font-size:11.5px;color:var(--ink2);}

  .label{font-size:13px;color:var(--ink2);margin:16px 0 7px;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;font-family:inherit;
    padding:9px 15px;font-size:14px;cursor:pointer;transition:.12s;min-height:42px;}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc);}
  .chip.sm{padding:8px 13px;font-size:13.5px;}
  .chip.unit{border-radius:12px;text-align:left;line-height:1.35;padding:9px 14px 9px 12px;}
  .chip.unit .ck{display:inline-block;width:18px;height:18px;line-height:16px;text-align:center;border:1.5px solid var(--line);
    border-radius:5px;margin-right:8px;font-size:12px;vertical-align:-3px;background:#fff;color:var(--acc);}
  .chip.unit.on .ck{border-color:#fff;}
  .chip.unit small{display:block;font-size:11px;opacity:.8;margin-left:26px;}
  .empty{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:14px;text-align:center;}

  .figbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin:0 0 12px;}
  .figbox svg{width:100%;height:auto;display:block;max-height:56vh;}
  .figcap{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px;}

  .btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;margin-top:16px;}
  .btn.primary{background:var(--acc);color:#fff;}
  .btn.primary:active{background:var(--acc-d);}
  .btn.primary:disabled{opacity:.4;}
  .btn.ghost{background:transparent;color:var(--blue);font-size:15px;padding:12px;font-weight:600;}
  .btn.resume{background:var(--acc-soft);color:var(--acc-d);}
  .btn.sm{padding:11px;font-size:15px;margin-top:10px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2);margin:6px 0 4px;}
  .prog{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:12px;}
  .prog > i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s;}

  .qcat{display:inline-block;font-size:12px;color:var(--acc-d);background:var(--acc-soft);border-radius:99px;padding:2px 10px;margin-bottom:10px;font-weight:600;}
  .qtype{color:var(--acc);font-weight:700;}
  .qtext{font-size:19px;font-weight:600;white-space:pre-line;margin:2px 0 16px;line-height:1.6;}

  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;
    padding:14px 15px;margin:9px 0;font-size:16px;cursor:pointer;color:var(--ink);transition:.1s;min-height:50px;}
  .opt:active{background:var(--bg);}
  .opt.correct{border-color:var(--ok);background:#e8f5ec;}
  .opt.wrong{border-color:var(--ng);background:#fdeaea;}
  .opt.dim{opacity:.5;}
  .opt .mk{float:right;font-weight:800;font-size:18px;}

  .ord-pool,.ord-ans{display:flex;flex-direction:column;gap:8px;margin:6px 0;}
  .ord-ans{min-height:8px;border:1.5px dashed var(--line);border-radius:11px;padding:8px;background:var(--bg);}
  .ord-item{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px;cursor:pointer;}
  .ord-item.correct{border-color:var(--ok);background:#e8f5ec;}
  .ord-item.wrong{border-color:var(--ng);background:#fdeaea;}
  .ord-item .num{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--acc);color:#fff;border-radius:99px;font-size:12px;margin-right:9px;}
  .ord-empty{color:var(--ink2);font-size:13px;text-align:center;padding:8px;}

  .reveal{background:var(--bg);border-radius:11px;padding:14px;margin-top:8px;}
  .ansinput{width:100%;font-size:18px;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;
    background:#fff;color:var(--ink);margin-bottom:10px;min-height:52px;}
  .ansinput:focus{outline:none;border-color:var(--acc);}
  .ansinput.correct{border-color:var(--ok);background:#e8f5ec;}
  .ansinput.wrong{border-color:var(--ng);background:#fdeaea;}
  .reveal h4{margin:0 0 6px;font-size:13px;color:var(--ink2);}
  .reveal .model{font-size:16px;margin-bottom:12px;}
  .kw{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line);}
  .kw input{width:22px;height:22px;accent-color:var(--ok);}
  .kw label{font-size:15px;}
  .selfask{font-size:14px;color:var(--ink2);margin:12px 0 4px;text-align:center;}
  .selfrow{display:flex;gap:10px;}
  .selfrow .btn{margin-top:6px;}
  .btn.maru{background:var(--ok);color:#fff;}
  .btn.batsu{background:#fff;color:var(--ng);border:1.5px solid var(--ng);}

  .fb{border-radius:11px;padding:13px 15px;margin-top:14px;font-size:15px;}
  .fb.ok{background:#e8f5ec;color:var(--ok);}
  .fb.ng{background:#fdeaea;color:var(--ng);}
  .fb b{font-size:17px;}
  .exp{font-size:14.5px;color:var(--ink);margin-top:8px;line-height:1.65;}

  .score-big{text-align:center;}
  .score-big .n{font-size:54px;font-weight:800;color:var(--acc);line-height:1.1;}
  .score-big .d{font-size:20px;color:var(--ink2);}
  .msg{text-align:center;font-size:16px;margin:6px 0 4px;}
  .wronglist{margin-top:14px;padding:0;}
  .wronglist li{font-size:14px;color:var(--ink2);margin:6px 0;list-style:none;border-left:3px solid var(--acc);padding:4px 0 4px 10px;}

  .hidden{display:none !important;}
  .footnote{text-align:center;font-size:11px;color:var(--ink2);margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= ホーム ================= -->
  <section id="home">
    <div class="seg" id="groupSeg"></div>
    <header>
      <p class="eyebrow" id="homeEyebrow">保健体育</p>
      <h1 id="homeTitle">体育</h1>
      <p class="sub" id="homeSub"></p>
    </header>

    <div class="card">
      <div class="stat-row">
        <div class="stat"><b id="st-ans">0</b><span>といた数</span></div>
        <div class="stat"><b id="st-acc">—</b><span>正答率</span></div>
        <div class="stat"><b id="st-wrong">0</b><span>にがて</span></div>
      </div>

      <div class="label">テスト範囲（タップで追加・解除。いくつでも選べます）</div>
      <div class="chips" id="unitChips"></div>

      <div id="optArea">
        <div class="label">はんい</div>
        <div class="chips" id="catChips"></div>

        <div class="label">もんだい数</div>
        <div class="chips" id="countChips">
          <button class="chip sm on" data-count="10">10問</button>
          <button class="chip sm" data-count="20">20問</button>
          <button class="chip sm" data-count="0">ぜんぶ</button>
        </div>

        <div class="label">出題形式</div>
        <div class="chips" id="modeChips">
          <button class="chip sm on" data-mode="choice">選択モード</button>
          <button class="chip sm" data-mode="input">入力モード（漢字でもかなでもOK）</button>
        </div>

        <button class="btn resume hidden" id="resumeBtn">▶ 続きから再開</button>
        <button class="btn primary" id="startBtn">スタート</button>
        <button class="btn ghost sm" id="reviewBtn">にがてな問題だけ復習する</button>
      </div>
    </div>

    <button class="btn ghost sm" id="resetBtn" style="max-width:280px;margin:0 auto;color:var(--ng);">記録をリセット</button>
    <p class="footnote">出題は毎回ランダム。記録はこの端末に保存されます。</p>
  </section>

  <!-- ================= 出題 ================= -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <span id="qcount">1 / 10</span>
      <span id="qscore">正解 0</span>
    </div>
    <div class="prog"><i id="progBar"></i></div>

    <div class="card">
      <span class="qcat" id="qcat"></span>
      <div class="qtext" id="qtext"></div>
      <div id="qbody"></div>
      <div id="qfeedback"></div>
    </div>

    <button class="btn primary hidden" id="nextBtn">次へ</button>
    <button class="btn ghost sm" id="quitBtn">やめてホームへ</button>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="score-big"><span class="n" id="rsScore">0</span><span class="d" id="rsTotal"> / 0</span></div>
      <p class="msg" id="rsMsg"></p>
      <ul class="wronglist" id="rsWrong"></ul>
      <button class="btn primary" id="againWrongBtn">まちがえた問題をもう一度</button>
      <button class="btn ghost" id="homeBtn">ホームへ戻る</button>
    </div>
  </section>

</div>

<script>
/* =======================================================================
   1) データ層 ── プリントを構造化したもの（ここを増やせば問題が増えます）
   -----------------------------------------------------------------------
   TERMS : [用語, よみ, 意味, 分野(cat), 種類, 別解の配列(省略可)]
           → 一問一答（語句→説明 / 説明→語句）を自動生成
   POOL  : {type:"mc"|"tf"|"order"|"desc", cat, q, ...}
           mc   : choices:[...], a:"正解", exp
           tf   : a:true/false, exp
           order: items:[正しい順], orderHint:"手順の順"(省略可), exp
           desc : model:"解答例", keywords:[...]
   FIGS  : {id:{kind:"label",cap,cat,vb,parts:[{n,t,r,alt,exp}],draw(hl){...}}}
           → draw() で実際に描いた番号（data-mk）だけ出題する
   ======================================================================= */

// --- グループ（体育分野 / 保健分野）---
const GROUPS = [
  {id:"taiiku", name:"体育", eyebrow:"保健体育 ・ 体育分野"},
  {id:"hoken",  name:"保健", eyebrow:"保健体育 ・ 保健分野"}
];

/* ---------- 図（オリジナルSVG）の部品 ---------- */
function _mk(n,x,y,hl){
  const on=(n===hl);
  return `<g data-mk="${n}"><circle cx="${x}" cy="${y}" r="${on?13:10.5}" style="fill:${on?"var(--acc)":"#fff"};stroke:${on?"var(--acc-d)":"#1c1c1e"}" stroke-width="1.6"/>`+
    `<text x="${x}" y="${y+4.3}" text-anchor="middle" font-size="${n>9?10.5:12.5}" font-weight="700" fill="${on?"#fff":"#1c1c1e"}">${n}</text></g>`;
}
function _ln(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6c6c70" stroke-width="1"/>`;}
function _tx(x,y,s,size,extra){return `<text x="${x}" y="${y}" font-size="${size||11}" fill="#6c6c70" text-anchor="middle" ${extra||""}>${s}</text>`;}
function _dot(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r||4}" fill="#1c1c1e"/>`;}

/* ===== 体育 ===== */

/* ---------- 体育 2学期 期末（バスケットボール・卓球・バレーボール）---------- */
const TERMS_T2K = [
  // バスケットボール
  ["バックコート","ばっくこーと","攻める方向と反対側（自分たちが守るゴールの側）のコート。センターラインもここにふくまれる","バスケ（ルール）","コート"],
  ["フロントコート","ふろんとこーと","攻める方向の側（相手のゴールがある側）のコート","バスケ（ルール）","コート"],
  ["クォーター","くぉーたー","バスケットボールの試合を区切った時間のまとまり。中学生は8分を4回行う","バスケ（ルール）","ルール",["Q"]],
  ["インターバル","いんたーばる","1Qと2Q、3Qと4Qの間にある2分間の休憩","バスケ（ルール）","ルール"],
  ["ハーフタイム","はーふたいむ","2Qと3Qの間にある15〜20分の休憩","バスケ（ルール）","ルール"],
  ["オーバータイム","おーばーたいむ","4Q終了時に同点のとき行う5分間の延長戦。勝敗が決まるまで繰り返す","バスケ（ルール）","ルール",["延長戦","えんちょうせん"]],
  ["タイムアウト","たいむあうと","試合中にとれる作戦タイム。前半2回、後半3回、各延長時限に1回とれる","バスケ（ルール）","ルール"],
  ["ポイントガード","ぽいんとがーど","コート上でチーム5人の動きを決めて指示を出す司令塔のポジション","バスケ（ルール）","ポジション",["PG"]],
  ["シューティングガード","しゅーてぃんぐがーど","PGを補佐しながら、長距離から3Pシュートを積極的にねらうポジション","バスケ（ルール）","ポジション",["SG"]],
  ["司令塔","しれいとう","全体の動きを把握し、冷静な判断をしながら攻守でチームを牽引する、PGの役割を表すことば","バスケ（ルール）","用語"],
  // 卓球
  ["シェークハンド","しぇーくはんど","両面にラバーが貼られ、フォア／バックの両面で打ち返せるラケット。現在最も使用者が多い","卓球","用具",["シェークハンドラケット"]],
  ["ペンホルダー","ぺんほるだー","威力のあるフォアハンドや小技が打ちやすく、台の近くでプレーする攻撃型の選手に向くラケット","卓球","用具",["ペンホルダーラケット"]],
  ["ラバー","らばー","ラケットの面に貼られているもの。めくったりしてはいけない","卓球","用具"],
  ["サポート","さぽーと","ネットを卓球台に固定して支える部分。ネットの白帯の紐をここに固定する","卓球","用具"],
  ["カットマン","かっとまん","守備型で、台から離れて戦うことが多い選手。ペンホルダーはほとんど使われない","卓球","用語"],
  ["デュース","でゅーす","10対10になった状態。2点差がつくまで続け、サービスは1本交代になる","卓球","ルール",["Deuce"]],
  ["エッジ","えっじ","卓球台の上の面のふち。ボールが触れた場合は有効になる（側面は失点）","卓球","コート"],
  ["ラブ・オール","らぶおーる","試合の始めに主審がするコール。審判を含めた4名で挨拶をする","卓球","コール",["ラブオール"]],
  ["チェンジサービス","ちぇんじさーびす","サービスが交代するときに主審がするコール","卓球","コール"],
  ["ゲームセット","げーむせっと","セットが終わったときに主審がするコール。このあと挨拶をする","卓球","コール"],
  ["主審","しゅしん","ルールを確認しながら試合を進行し、得点を数える審判","卓球","審判"],
  ["副審","ふくしん","主審の判定に間違いがないか確認し、得点した選手側の手を挙げる審判","卓球","審判"],
  ["ボールコレクター","ぼーるこれくたー","ボールを拾う係。正式には1ボール制なので、みんなで協力して拾う","卓球","審判"],
  // バレーボール（公式ルール）
  ["ラリーポイント制","らりーぽいんとせい","どちらのチームがサーブしていても、ラリーを制したチームが得点となるしくみ","バレーボール","ルール"],
  ["6人制","ろくにんせい","オリンピックやSVリーグなどの競技レベルで採用されている方式（9人制のバレーもある）","バレーボール","ルール",["ろくにんせい"]],
  ["アタックライン","あたっくらいん","ネットから3mの位置に引かれ、前衛と後衛を分けるライン","バレーボール","コート",["3mライン","さんめーとるらいん"]],
  ["ローテーション","ろーてーしょん","サーブ権を得るごとに、選手の配置を時計回りに1つずつ移動すること","バレーボール","ルール"],
  ["バックライト","ばっくらいと","後衛の右側の位置。サーバーはここのコート外からサーブを打つ","バレーボール","ポジション"],
  ["リベロ","りべろ","守備専門の選手。ほかの選手と異なるユニフォームを着て、後衛の選手と自由に交代できる","バレーボール","ポジション"],
  ["ダブルコンタクト","だぶるこんたくと","同一選手が2回連続でボールに触れる反則（ドリブルともいう）","バレーボール","反則",["ドリブル"]],
  ["キャッチボール","きゃっちぼーる","ボールをキャッチしたり持ち上げたりする、不自然なボール処理の反則（ホールディングともいう）","バレーボール","反則",["ホールディング"]],
  ["マーカー外通過","まーかーそとつうか","ボールがアンテナの外側を通過する反則","バレーボール","反則",["まーかーがいつうか"]],
  ["タッチネット","たっちねっと","ネットに身体が触れる反則","バレーボール","反則"],
  ["フットフォールト","ふっとふぉーると","サーブ時にエンドラインを踏んだり、延長線上から踏み出したりする反則","バレーボール","反則",["フットフォルト"]],
  ["フローターサーブ","ふろーたーさーぶ","肩や肘を痛める恐れがあるため、授業（桜蔭ルール）では禁止されているサーブ","バレー（桜蔭ルール）","ルール"],
  // バスケットボール（歴史）
  ["ジェームズ・ネイスミス","じぇーむずねいすみす","1891年、アメリカのYMCA国際トレーニングスクールでバスケットボールを考案した体育指導者（博士）","バスケ（歴史）","人物",["ネイスミス","ねいすみす","ジェームズネイスミス"]],

  {type:"mc",cat:"卓球",q:"主審は、どちらの選手の側から得点をコールする？",choices:["サービスのプレーヤー側から","レシーブのプレーヤー側から","得点の多い選手から","主審から見て左側の選手から"],a:"サービスのプレーヤー側から",exp:"主審は常にサービスのプレーヤー側から得点をコールする。"},
  {type:"mc",cat:"卓球",q:"得点が「2対3」のときのコールは？",choices:["ツー・スリー","スリー・ツー","ツー・オール","ゲームセット"],a:"ツー・スリー",exp:"サービスのプレーヤー側から「ツー・スリー」とコールする。"},
  {type:"mc",cat:"卓球",q:"0点のコールは？",choices:["「ラブ」か「ゼロ」","「オール」","「デュース」","「ナッシング」"],a:"「ラブ」か「ゼロ」",exp:"0点は「ラブ」「ゼロ」のどちらか。"},
  {type:"tf",cat:"卓球",q:"10対10でデュースになったときは、主審が「デュース」と特別なコールをする。",a:false,exp:"デュースに特別なコールはない。ただしサービスが1本交代になるので、毎回チェンジサービスのコールをする。"},

  {type:"desc",cat:"卓球",q:"シェークハンドとペンホルダーの特徴のちがいを説明しよう。",model:"シェークハンドは両面にラバーが貼られ、フォア／バックの両面で打ち返せてバックハンドのプレーを行いやすく、現在最も使用者が多い。ペンホルダーは威力のあるフォアハンドや小技を行いやすく、台の近くでプレーする攻撃型に向くが、裏面にラバーがないタイプが一般的でバックハンドを打てない。",keywords:["シェーク：両面で打てる","シェーク：最も使用者が多い","ペン：フォアハンド・小技","ペン：バックハンドを打てない"]},

// 種類を大まかな「系統」にまとめる（同じ種類のダミーが足りないときの補充先）
// ※ 種類はプリントを見てから確定・追加する。ここにない種類は、その種類自体を系統として扱う
const FAMILY={
  // 体育
  ルール:"ことば",用語:"ことば",技能:"動き",技:"動き",用具:"もの",用具施設:"もの",ポジション:"人",

};
const EXTRA_DUMMY={};

/* =======================================================================
   3) 生成層 ── 用語データから一問一答を自動生成
   ======================================================================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistinct(pool,n,exclude){
  const out=[];const used=new Set(exclude||[]);
  for(const x of shuffle(pool)){if(out.length>=n)break;if(!used.has(x)){out.push(x);used.add(x);}}
  return out;
}
// 2つの説明文が似すぎていないか（文字2-gramの重なり率）。似すぎるダミーは除外
function tooSimilar(a,b){
  const grams=s=>{const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g;};
  const A=grams(a),B=grams(b);if(A.size===0||B.size===0)return false;
  let inter=0;A.forEach(x=>{if(B.has(x))inter++;});
  return inter/(A.size+B.size-inter) > 0.8;
}
const fam=k=>FAMILY[k]||k;
function groupTerms(g){return UNITS.filter(u=>u.group===g).reduce((a,u)=>a.concat(u.terms||[]),[]);}
function allFigs(){return UNITS.reduce((a,u)=>Object.assign(a,u.figs||{}),{});}

// widen: ダミーが足りなければ、同じグループの他の範囲の同系統の用語からも補う
function generateFromTerms(terms,group){
  const toObj=t=>({term:t[0],read:t[1],mean:t[2],cat:t[3],kind:t[4]||t[3],alt:t[5]||[]});
  const objs=terms.map(toObj);
  const qs=[];
  function candidates(t,key,correct){
    const sim=(key==="mean")?(x=>tooSimilar(x,correct)):(()=>false);
    const collect=arr=>arr.filter(o=>o.term!==t.term).map(o=>o[key]).filter(v=>v!==correct&&!sim(v));
    let pool=Array.from(new Set(collect(objs.filter(o=>o.kind===t.kind))));
    if(pool.length<3)pool=Array.from(new Set(pool.concat(collect(objs.filter(o=>fam(o.kind)===fam(t.kind))))));
    if(pool.length<3&&key==="term"&&EXTRA_DUMMY[t.kind])
      pool=Array.from(new Set(pool.concat(EXTRA_DUMMY[t.kind].filter(v=>v!==correct))));
    if(pool.length<3){
      const others=groupTerms(group).map(toObj).filter(o=>fam(o.kind)===fam(t.kind));
      pool=Array.from(new Set(pool.concat(collect(others))));
    }
    if(pool.length<3){ // それでも足りなければ同じ範囲の何でも
      pool=Array.from(new Set(pool.concat(collect(objs))));
    }
    return pool;
  }
  objs.forEach(t=>{
    qs.push({type:"mc",cat:t.cat,inputable:false,
      q:`「${t.term}」の説明として正しいものはどれ？`,
      choices:shuffle([t.mean,...pickDistinct(candidates(t,"mean",t.mean),3,[t.mean])]),
      a:t.mean,exp:`${t.term}（${t.read}）… ${t.mean}`});
    qs.push({type:"mc",cat:t.cat,inputable:true,term:t.term,read:t.read,answers:[t.term,t.read,...t.alt],
      q:`次の説明にあてはまる語句はどれ？\n「${t.mean}」`,
      choices:shuffle([t.term,...pickDistinct(candidates(t,"term",t.term),3,[t.term])]),
      a:t.term,exp:`答え：${t.term}（${t.read}）`});
  });
  return qs;
}

/* --- 図の問題（label）：図に実際に描いた番号だけを出題する --- */
function drawnMarkers(f){
  const svg=f.draw(0),nums=[],re=/data-mk="(\d+)"/g;let m;
  while((m=re.exec(svg)))nums.push(+m[1]);
  return nums;
}
function figQuestions(figs){
  const qs=[];
  for(const id in figs){
    const f=figs[id];
    if(f.kind!=="label")continue;
    const drawn=drawnMarkers(f);
    const parts=f.parts.filter(p=>drawn.includes(p.n));
    parts.forEach(p=>{
      const others=parts.filter(o=>o.t!==p.t).map(o=>o.t);
      qs.push({type:"mc",label:"図",cat:f.cat,fig:id,hl:p.n,inputable:true,
        term:p.t,read:p.r||"",answers:[p.t,p.r||"",...(p.alt||[])].filter(Boolean),
        q:`図の【${p.n}】にあてはまるものは？`,qInput:`図の【${p.n}】は何？`,
        listText:`${f.cap}の【${p.n}】`,
        choices:shuffle([p.t,...pickDistinct(others,3,[p.t])]),a:p.t,
        exp:`【${p.n}】${p.t}${p.r?"（"+p.r+"）":""}… ${p.exp||""}`});
    });
  }
  return qs;
}
function figSvg(id,hl){
  const f=allFigs()[id];if(!f)return "";
  return `<div class="figbox"><svg viewBox="${f.vb}" preserveAspectRatio="xMidYMid meet" font-family="-apple-system,Hiragino Sans,Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">${f.draw(hl)}</svg>`+
    `<div class="figcap">${escapeHtml(f.cap)}</div></div>`;
}

// 全問題を作る。IDは内容から作る（問題を途中に足しても記録がずれない）
const ALL = [];
UNITS.forEach(u=>{
  const qs=generateFromTerms(u.terms||[],u.group).concat(figQuestions(u.figs||{}),u.pool||[]);
  const seen={};
  qs.forEach(q=>{
    let id=u.id+"|"+q.type+"|"+(q.fig?q.fig+(q.hl||""):"")+"|"+q.q.replace(/\s/g,"").slice(0,40)+"|"+String(q.a).slice(0,16);
    if(seen[id]){seen[id]++;id+="#"+seen[id];}else seen[id]=1;
    q.unit=u.id;q.group=u.group;q.id=id;
  });
  ALL.push(...qs);
});

function loadUI(){
  let u=null;try{u=JSON.parse(localStorage.getItem(UI_KEY));}catch(e){u=mem.ui;}
  u=u||{};
  const group=GROUPS.some(g=>g.id===u.group)?u.group:GROUPS[0].id;
  const units={};
  GROUPS.forEach(g=>{
    const list=UNITS.filter(x=>x.group===g.id);
    const ok=((u.units||{})[g.id]||[]).filter(id=>list.some(x=>x.id===id));
    units[g.id]=new Set(ok.length?ok:(list.length?[list[list.length-1].id]:[])); // はじめは一番新しい範囲
  });
  return {group,units};
}
function saveUI(){
  const o={group:state.group,units:{}};
  GROUPS.forEach(g=>o.units[g.id]=[...state.unitsByGroup[g.id]]);

   ======================================================================= */
const ui0=loadUI();
let state={group:ui0.group,unitsByGroup:ui0.units,cat:"全範囲",count:10,mode:"choice",
  list:[],idx:0,score:0,answered:false,wrongThisRound:[]};
const curGroup=()=>GROUPS.find(g=>g.id===state.group);
const groupUnits=()=>UNITS.filter(u=>u.group===state.group);
const selSet=()=>state.unitsByGroup[state.group];
function selUnits(){return groupUnits().filter(u=>selSet().has(u.id));}
function inSel(q){return q.group===state.group&&selSet().has(q.unit);}
function catList(){
  const sel=selUnits();const list=["全範囲"];
  if(sel.some(u=>Object.keys(u.figs||{}).length))list.push(FIG_CAT);
  sel.forEach(u=>(u.cats||[]).forEach(c=>{if(!list.includes(c))list.push(c);}));
  return list;
}

// --- グループ切り替え ---
function renderGroupSeg(){
  const box=document.getElementById("groupSeg");box.innerHTML="";
  GROUPS.forEach(g=>{
    const b=document.createElement("button");
    b.textContent=g.name;if(g.id===state.group)b.className="on";
    b.onclick=()=>{if(g.id===state.group)return;state.group=g.id;state.cat="全範囲";saveUI();renderHome();};
    box.appendChild(b);
  });
  document.body.className="g-"+state.group;
}

// --- テスト範囲のタブ ---
function renderUnits(){
  const box=document.getElementById("unitChips");box.innerHTML="";
  const list=groupUnits();
  if(!list.length){
    box.innerHTML=`<div class="empty">${escapeHtml(curGroup().name)}の問題はまだありません。<br>プリントから問題を作って追加すると、ここに範囲が出ます。</div>`;
    return;
  }
  list.forEach(u=>{
    const on=selSet().has(u.id);
    const b=document.createElement("button");
    b.className="chip unit"+(on?" on":"");
    b.innerHTML=`<span class="ck">${on?"✓":""}</span>${escapeHtml(u.title)}<small>${escapeHtml(u.sub||"")}</small>`;
    b.onclick=()=>{
      if(on&&selSet().size===1)return; // 最低1つは選ぶ
      if(on)selSet().delete(u.id);else selSet().add(u.id);
      saveUI();
      renderHome();
    };
    box.appendChild(b);
  });
}
function renderHeader(){
  const g=curGroup(),sel=selUnits();
  document.getElementById("homeEyebrow").textContent=g.eyebrow;
  document.getElementById("homeTitle").textContent=sel.length===1?`${g.name}　${sel[0].title}`:`${g.name} 問題集`;
  document.getElementById("homeSub").textContent=sel.length===1?(sel[0].sub||""):sel.map(u=>u.title).join(" ＋ ");
}
function renderHome(){
  if(!catList().includes(state.cat))state.cat="全範囲";
  renderGroupSeg();renderUnits();renderHeader();renderCats();renderStats();
  document.getElementById("optArea").classList.toggle("hidden",groupUnits().length===0);
}

function renderCats(){
  const box=document.getElementById("catChips");box.innerHTML="";
  catList().forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c===state.cat?" on":"");b.textContent=c;
    b.onclick=()=>{state.cat=c;renderCats();};
    box.appendChild(b);
  });
}
function renderStats(){
  const d=getData();let seen=0,correct=0;
  const ids=new Set(ALL.filter(inSel).map(q=>q.id));
  Object.keys(d.stats).forEach(id=>{if(!ids.has(id))return;const s=d.stats[id];seen+=s.seen;correct+=s.correct;});
  document.getElementById("st-ans").textContent=seen;
  document.getElementById("st-acc").textContent=seen?Math.round(correct/seen*100)+"%":"—";
  document.getElementById("st-wrong").textContent=d.wrong.filter(id=>ids.has(id)).length;
  const btn=document.getElementById("resumeBtn");
  if(hasResume()){
    const r=getData().resume[state.group];
    btn.textContent=`▶ 続きから再開（${r.idx+1}/${r.ids.length}問目）`;
    btn.classList.remove("hidden");
  }else btn.classList.add("hidden");
}

// --- 中断・再開（グループごと）---
function findQById(id){return ALL.find(q=>q.id===id);}
function hasResume(){const r=getData().resume[state.group];return !!(r&&r.ids&&r.idx<r.ids.length);}
function saveResume(){
  const d=getData();
  d.resume[state.group]={ids:state.list.map(q=>q.id),idx:state.idx,score:state.score,
    wrong:state.wrongThisRound.map(q=>q.id),mode:state.mode,cat:state.cat};
  store.save(d);
}
function clearResume(){const d=getData();delete d.resume[state.group];store.save(d);}
function resumeQuiz(){
  const r=getData().resume[state.group];if(!r)return;
  state.list=r.ids.map(findQById).filter(Boolean);
  if(state.list.length===0){clearResume();renderStats();return;}
  state.idx=Math.min(r.idx,state.list.length-1);
  state.score=r.score||0;
  state.wrongThisRound=(r.wrong||[]).map(findQById).filter(Boolean);
  state.mode=r.mode||"choice";
  state.cat=r.cat||state.cat;
  show("quiz");renderQuestion();
}

document.getElementById("countChips").addEventListener("click",e=>{
  if(!e.target.dataset.count)return;
  state.count=+e.target.dataset.count;
  [...document.querySelectorAll("#countChips .chip")].forEach(c=>c.classList.toggle("on",c===e.target));
});
document.getElementById("modeChips").addEventListener("click",e=>{
  if(!e.target.dataset.mode)return;
  state.mode=e.target.dataset.mode;
  [...document.querySelectorAll("#modeChips .chip")].forEach(c=>c.classList.toggle("on",c===e.target));
});

// --- 出題セット作成 ---
function buildList(reviewOnly){
  let pool=ALL.filter(inSel);
  if(reviewOnly){const w=new Set(getData().wrong);pool=pool.filter(q=>w.has(q.id));}
  else if(state.cat===FIG_CAT){pool=pool.filter(q=>q.fig);}
  else if(state.cat!=="全範囲"){pool=pool.filter(q=>q.cat===state.cat);}
  pool=shuffle(pool);
  if(state.count>0)pool=pool.slice(0,state.count);
  return pool;
}
function startQuiz(reviewOnly){
  const list=buildList(reviewOnly);
  if(list.length===0){alert(reviewOnly?"にがてな問題はまだありません。まずは通常モードで挑戦しよう！":"この範囲の問題がありません。");return;}
  clearResume();
  state.list=list;state.idx=0;state.score=0;state.wrongThisRound=[];
  show("quiz");renderQuestion();
}
function show(id){["home","quiz","result"].forEach(s=>document.getElementById(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

// --- 問題描画 ---
function renderQuestion(){
  const q=state.list[state.idx];state.answered=false;
  document.getElementById("qcount").textContent=`${state.idx+1} / ${state.list.length}`;
  document.getElementById("qscore").textContent=`正解 ${state.score}`;
  document.getElementById("progBar").style.width=(state.idx/state.list.length*100)+"%";
  document.getElementById("qcat").textContent=q.cat;
  const inputMode=(state.mode==="input"&&q.type==="mc"&&q.inputable);
  const qtextStr=inputMode?(q.qInput||q.q.replace("あてはまる語句はどれ？","あてはまる語句は？")):q.q;
  const tlabel=(q.label?q.label+"・":"")+(inputMode?"入力":TYPE_LABEL[q.type]);
  document.getElementById("qtext").innerHTML=`<span class="qtype">［${tlabel}］</span> `+escapeHtml(qtextStr);
  document.getElementById("qfeedback").innerHTML="";
  document.getElementById("nextBtn").classList.add("hidden");
  const body=document.getElementById("qbody");body.innerHTML="";
  if(q.fig){const fw=document.createElement("div");fw.innerHTML=figSvg(q.fig,q.hl);body.appendChild(fw.firstChild);}
  if(inputMode)            renderInput(q,body);
  else if(q.type==="mc")   renderMC(q,body);
  else if(q.type==="tf")   renderTF(q,body);
  else if(q.type==="order")renderOrder(q,body);
  else if(q.type==="desc") renderDesc(q,body);
}

// 入力のゆらぎを吸収：全角英数→半角、カタカナ→ひらがな、空白除去
function normalize(s){
  s=(s||"").trim();
  s=s.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/[\s　]/g,"");
  return s.toLowerCase();
}
function renderInput(q,body){
  const answers=(q.answers||[q.a]).map(normalize);
  const wrap=document.createElement("div");
  const inp=document.createElement("input");
  inp.type="text";inp.className="ansinput";
  inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");
  inp.setAttribute("autocorrect","off");inp.placeholder="答えを入力（漢字でもかなでもOK）";
  wrap.appendChild(inp);
  const row=document.createElement("div");row.className="selfrow";
  const dunno=document.createElement("button");dunno.className="btn batsu sm";dunno.textContent="わからない";
  const check=document.createElement("button");check.className="btn primary sm";check.textContent="答え合わせ";
  row.appendChild(dunno);row.appendChild(check);wrap.appendChild(row);
  body.appendChild(wrap);
  setTimeout(()=>inp.focus(),50);

  // 自動採点 → 不一致なら自己採点にフォールバック（表記ゆれの救済）
  function grade(typed){
    if(state.answered)return;
    const ok=typed!==null&&answers.includes(normalize(typed));
    inp.disabled=true;row.remove();
    const fb=document.getElementById("qfeedback");
    const ansLine=`<div class="exp">正解：${escapeHtml(q.term)}${q.read?"（"+escapeHtml(q.read)+"）":""}</div>`+(q.fig&&q.exp?`<div class="exp">${escapeHtml(q.exp)}</div>`:``);
    if(ok||typed===null||!typed.trim()){
      state.answered=true;
      inp.classList.add(ok?"correct":"wrong");
      fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"○ 正解！":"× おしい"}</b>${ansLine}</div>`;
      finishQuestion(q,ok,true,true);
      return;
    }
    fb.innerHTML=`<div class="reveal">${ansLine}<p class="selfask">自分の答えは合っていた？（書き方のちがいだけなら○）</p></div>`;
    const sr=document.createElement("div");sr.className="selfrow";
    const yes=document.createElement("button");yes.className="btn maru sm";yes.textContent="○ 合っていた";
    const no=document.createElement("button");no.className="btn batsu sm";no.textContent="× まちがえた";
    const done=ok2=>{if(state.answered)return;state.answered=true;inp.classList.add(ok2?"correct":"wrong");sr.remove();finishQuestion(q,ok2,true,true);};
    yes.onclick=()=>done(true);no.onclick=()=>done(false);
    sr.appendChild(yes);sr.appendChild(no);fb.firstChild.appendChild(sr);
  }
  check.onclick=()=>grade(inp.value);
  dunno.onclick=()=>grade(null);
  inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.isComposing)grade(inp.value);});
}

function renderMC(q,body){
  q.choices.forEach(c=>{
    const b=document.createElement("button");b.className="opt";b.textContent=c;
    b.onclick=()=>{if(state.answered)return;gradeChoice(q,c,b,q.a);};
    body.appendChild(b);
  });
}
function renderTF(q,body){
  [["○ 正しい",true],["× 誤り",false]].forEach(([t,val])=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{if(state.answered)return;gradeChoice(q,val,b,q.a);};
    body.appendChild(b);
  });
}
function gradeChoice(q,chosen,btn,answer){
  state.answered=true;
  const ok=chosen===answer;
  [...btn.parentNode.children].forEach(el=>{
    if(!el.classList.contains("opt"))return;
    el.classList.add("dim");
    const isAns=(q.type==="tf")?((el.textContent[0]==="○")===answer):(el.textContent===answer);
    if(isAns){el.classList.remove("dim");el.classList.add("correct");el.innerHTML+='<span class="mk">○</span>';}
  });
  if(!ok){btn.classList.remove("dim");btn.classList.add("wrong");btn.innerHTML+='<span class="mk">×</span>';}
  finishQuestion(q,ok);
}

function renderOrder(q,body){
  const correct=q.items;const shuffled=shuffle(q.items);let answer=[];
  const hintText=q.orderHint||"正しい順";
  const ansBox=document.createElement("div");ansBox.className="ord-ans";
  const poolBox=document.createElement("div");poolBox.className="ord-pool";
  const hint=document.createElement("div");hint.className="ord-empty";hint.textContent=`↑ ここに${hintText}で並びます`;
  ansBox.appendChild(hint);
  function redraw(){
    ansBox.innerHTML="";
    if(answer.length===0)ansBox.appendChild(hint);
    answer.forEach((t,i)=>{
      const el=document.createElement("div");el.className="ord-item";
      el.innerHTML=`<span class="num">${i+1}</span>${escapeHtml(t)}`;
      el.onclick=()=>{if(state.answered)return;answer.splice(i,1);redraw();};
      ansBox.appendChild(el);
    });
    [...poolBox.children].forEach(el=>{el.style.display=answer.includes(el.dataset.t)?"none":"block";});
  }
  shuffled.forEach(t=>{
    const el=document.createElement("div");el.className="ord-item";el.dataset.t=t;el.textContent=t;
    el.onclick=()=>{if(state.answered)return;answer.push(t);redraw();};
    poolBox.appendChild(el);
  });
  const check=document.createElement("button");check.className="btn primary sm";check.textContent="答え合わせ";
  check.onclick=()=>{
    if(state.answered)return;
    if(answer.length!==correct.length){alert("ぜんぶ並べてね。");return;}
    state.answered=true;
    const ok=answer.every((t,i)=>t===correct[i]);
    [...ansBox.children].forEach((el,i)=>{
      if(el.classList.contains("ord-empty"))return;
      el.classList.add(answer[i]===correct[i]?"correct":"wrong");
    });
    if(!ok){
      const ans=document.createElement("div");ans.style.cssText="margin-top:10px;font-size:14px;color:var(--ink2)";
      ans.innerHTML=hintText+"：<b>"+correct.map(escapeHtml).join(" → ")+"</b>";
      body.appendChild(ans);
    }
    finishQuestion(q,ok);
  };
  body.appendChild(ansBox);
  const lbl=document.createElement("div");lbl.className="ord-empty";lbl.textContent="下のカードをタップして並べよう";
  body.appendChild(lbl);
  body.appendChild(poolBox);body.appendChild(check);
  redraw();
}

function renderDesc(q,body){
  const note=document.createElement("div");note.className="ord-empty";
  note.textContent="頭の中（または紙）で答えてから、下のボタンを押そう。";
  body.appendChild(note);
  const reveal=document.createElement("button");reveal.className="btn primary sm";reveal.textContent="答えを確認する";
  reveal.onclick=()=>{
    reveal.remove();
    const box=document.createElement("div");box.className="reveal";
    box.innerHTML=`<h4>解答例</h4><div class="model">${escapeHtml(q.model)}</div>`+((q.keywords||[]).length?`<h4>入っているとよいキーワード</h4>`:``);
    (q.keywords||[]).forEach((k,i)=>{
      const row=document.createElement("div");row.className="kw";
      row.innerHTML=`<input type="checkbox" id="kw${i}"><label for="kw${i}">${escapeHtml(k)}</label>`;
      box.appendChild(row);
    });
    const ask=document.createElement("p");ask.className="selfask";ask.textContent="自分の答えは、ねらいに合っていた？";
    box.appendChild(ask);
    const row=document.createElement("div");row.className="selfrow";
    const yes=document.createElement("button");yes.className="btn maru sm";yes.textContent="○ できた";
    const no=document.createElement("button");no.className="btn batsu sm";no.textContent="× もう一度";
    yes.onclick=()=>{if(state.answered)return;state.answered=true;row.remove();finishQuestion(q,true,true);};
    no.onclick=()=>{if(state.answered)return;state.answered=true;row.remove();finishQuestion(q,false,true);};
    row.appendChild(yes);row.appendChild(no);box.appendChild(row);
    body.appendChild(box);
  };
  body.appendChild(reveal);
}

// --- 採点後の共通処理 ---
function finishQuestion(q,ok,quiet,skipFb){
  if(ok)state.score++;else state.wrongThisRound.push(q);
  const d=getData();
  const s=d.stats[q.id]||{seen:0,correct:0};s.seen++;if(ok)s.correct++;d.stats[q.id]=s;
  const ws=new Set(d.wrong);if(ok)ws.delete(q.id);else ws.add(q.id);d.wrong=[...ws];
  store.save(d);
  const fb=document.getElementById("qfeedback");
  if(!skipFb){
    if(!quiet){
      fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"○ 正解！":"× おしい"}</b>`+
        (q.exp?`<div class="exp">${escapeHtml(q.exp)}</div>`:``)+`</div>`;
    }else if(q.exp){
      fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><div class="exp">${escapeHtml(q.exp)}</div></div>`;
    }
  }
  document.getElementById("qscore").textContent=`正解 ${state.score}`;
  document.getElementById("nextBtn").classList.remove("hidden");
}

document.getElementById("nextBtn").onclick=()=>{
  state.idx++;
  if(state.idx>=state.list.length)showResult();else renderQuestion();
};

function showResult(){
  document.getElementById("progBar").style.width="100%";
  const total=state.list.length;
  document.getElementById("rsScore").textContent=state.score;
  document.getElementById("rsTotal").textContent=` / ${total}`;
  const pct=Math.round(state.score/total*100);
  document.getElementById("rsMsg").textContent=pct===100?"全問正解！みごとです。":pct>=80?"よくできました！":pct>=50?"その調子。あと少し。":"くり返せば必ず力になります。";
  const ul=document.getElementById("rsWrong");ul.innerHTML="";
  if(state.wrongThisRound.length){
    const h=document.createElement("div");h.className="label";h.textContent="まちがえた問題";ul.appendChild(h);
    state.wrongThisRound.forEach(q=>{const li=document.createElement("li");li.textContent=(q.listText?q.listText+"：":"")+q.q.replace(/\n/g," ");ul.appendChild(li);});
  }
  document.getElementById("againWrongBtn").style.display=state.wrongThisRound.length?"block":"none";
  clearResume();
  show("result");renderStats();
}

document.getElementById("startBtn").onclick=()=>startQuiz(false);
document.getElementById("reviewBtn").onclick=()=>startQuiz(true);
document.getElementById("resumeBtn").onclick=()=>resumeQuiz();
document.getElementById("quitBtn").onclick=()=>{
  const remaining=state.idx<state.list.length;
  const msg=remaining?"ホームに戻りますか？\n途中までの内容は保存され、ホームの「続きから再開」であとで続けられます。":"ホームに戻りますか？";
  if(!confirm(msg))return;
  if(remaining)saveResume();else clearResume();
  show("home");renderHome();
};
document.getElementById("homeBtn").onclick=()=>{show("home");renderHome();};
document.getElementById("againWrongBtn").onclick=()=>{
  clearResume();
  state.list=shuffle(state.wrongThisRound);state.idx=0;state.score=0;state.wrongThisRound=[];
  show("quiz");renderQuestion();
};
// リセットは「いま選んでいるグループ」の記録だけ消す
document.getElementById("resetBtn").onclick=()=>{
  const g=curGroup();
  if(!confirm(`「${g.name}」の記録（といた数・正答率・にがて・中断中の問題）をすべて消します。よろしいですか？`))return;
  const d=getData();
  const ids=new Set(ALL.filter(q=>q.group===g.id).map(q=>q.id));
  const unitIds=new Set(UNITS.filter(u=>u.group===g.id).map(u=>u.id));
  Object.keys(d.stats).forEach(id=>{if(ids.has(id)||unitIds.has(id.split("|")[0]))delete d.stats[id];});
  d.wrong=d.wrong.filter(id=>!ids.has(id));
  delete d.resume[g.id];
  store.save(d);renderStats();
};

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

renderHome();
</script>
